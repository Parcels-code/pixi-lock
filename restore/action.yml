name: Restore Pixi Lock
description: Restore a previously cached pixi.lock file.

inputs:
  cache-key:
    description: "The cache key from create-and-cache"
    required: true
  manifest-path:
    required: false
    description: >-
      Path to the manifest file (i.e., `pixi.toml`) to use for the pixi CLI. Defaults to `pixi.toml`, falling back to `pyproject.toml`.

runs:
  using: "composite"
  steps:
    - name: Check cache-key
      shell: bash
      env:
        CACHE_KEY: ${{ inputs.cache-key }}
      run: |
        if [[ -z "${CACHE_KEY}" ]]; then
          echo "::error::cache-key cannot be an empty string"
          exit 1
        fi

    - name: Calculate fallback key
      id: fallback
      shell: bash
      env:
        CACHE_KEY: ${{ inputs.cache-key }}
      run: |
        cache_key="${CACHE_KEY}"
        # Extract base (everything before the last _) and date (after the last _)
        base="${cache_key%_*}"
        current_date="${cache_key##*_}"
        # Calculate yesterday's date
        yesterday=$(date -d "${current_date} - 1 day" +'%Y-%m-%d' 2>/dev/null || date -j -f '%Y-%m-%d' -v-1d "${current_date}" +'%Y-%m-%d')
        echo "key=${base}_${yesterday}" >> "$GITHUB_OUTPUT"

    - name: Calculate the lock file path
      id: lock-path
      shell: bash
      env:
        MANIFEST_PATH: ${{ inputs.manifest-path }}
      run: |
        if [[ -z "$MANIFEST_PATH" ]]; then
          lock_path=pixi.lock
        else
          base=$(dirname $MANIFEST_PATH)
          lock_path="$base/pixi.lock"
        fi

        echo "lock-path=${lock_path}" >> "$GITHUB_OUTPUT"

    - name: Restore pixi.lock from cache
      uses: actions/cache/restore@8b402f58fbc84540c8b491a91e594a4576fec3d7 # v5.0.2
      id: restore
      with:
        path: ${{ steps.lock-path.outputs.lock-path }}
        key: ${{ inputs.cache-key }}
        enableCrossOsArchive: true
        restore-keys: |
          ${{ steps.fallback.outputs.key }}
        fail-on-cache-miss: true
